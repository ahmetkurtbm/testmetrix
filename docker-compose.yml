# Yerel veritabanı: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testmetrix
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testmetrix"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
